<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <title>YourCuteHub</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header>
      <div class="avatar" id="avatar">🐱</div>
      <div class="title">
        <h1>YourCuteHub</h1>
        <p id="stats">今天也要開開心心</p>
      </div>
      <label class="switch" title="開啟／關閉小可愛">
        <input type="checkbox" id="enabled" aria-label="開啟小可愛" />
        <span></span>
      </label>
    </header>

    <button class="cheer" id="cheer" type="button">給我一點鼓勵 💖</button>
    <p class="hint" id="cheerHint"></p>

    <div class="group">
      <div class="label">情緒價值等級</div>
      <div class="seg levels" id="levels" role="radiogroup" aria-label="情緒價值等級"></div>
      <p class="note" id="levelDesc"></p>
    </div>

    <div class="group">
      <div class="label">鼓勵頻率</div>
      <div class="seg chips" id="intervals" role="radiogroup" aria-label="鼓勵頻率"></div>
      <div class="custom" id="customBox" hidden>
        每
        <input type="number" id="customValue" min="1" max="999" step="1" aria-label="自訂數值" />
        <select id="customUnit" aria-label="自訂單位">
          <option value="1">秒</option>
          <option value="60">分鐘</option>
          <option value="3600">小時</option>
        </select>
        鼓勵一次
      </div>
    </div>

    <div class="group">
      <div class="label">陪你的小可愛</div>
      <div class="mascots" id="mascots" role="radiogroup" aria-label="小可愛"></div>
    </div>

    <div class="group">
      <label class="label" for="nickname">怎麼叫你</label>
      <input type="text" id="nickname" maxlength="12" placeholder="寶貝" />
    </div>

    <details>
      <summary>更多設定</summary>
      <label class="row">
        <span>休息提醒</span>
        <select id="restReminder">
          <option value="25">連續 25 分鐘</option>
          <option value="50">連續 50 分鐘</option>
          <option value="90">連續 90 分鐘</option>
          <option value="0">不提醒</option>
        </select>
      </label>
      <label class="row">
        <span>位置</span>
        <select id="position">
          <option value="right">右下角</option>
          <option value="left">左下角</option>
        </select>
      </label>
      <label class="row">
        <span>對打字、複製、送出、讀完文章給回饋</span>
        <input type="checkbox" id="reactions" />
      </label>
      <label class="row">
        <span>深夜提醒早點睡</span>
        <input type="checkbox" id="nightOwl" />
      </label>
      <label class="row" id="siteRow">
        <span>不在 <b id="siteName">這個網站</b> 出現</span>
        <input type="checkbox" id="siteDisabled" />
      </label>
    </details>

    <footer>☁️ 設定會隨瀏覽器帳號雲端同步</footer>

    <script src="../src/settings.js"></script>
    <script src="../src/messages.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
